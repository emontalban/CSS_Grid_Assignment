<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice Grid</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Betania+Patmos+In+GDL&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   
   
</head>
<body>
    <div class="gridOne">
        <p>Hello World</p>
        <p style="color: blue;">My Fantastic Content</p>
    </div>
    <hr>
    <div class="gridTwo">
        <div class="red">Red</div>
        <div class="blue">Blue</div>
        <div class="yellow">Yellow</div>
    </div>
    <hr>
    <div class="gridThree">
        <div class="paragraph">
            <p>Endless views</p>
        </div>
        <img class="imagen" src="images/playa.jpg" alt="playa">
    </div>
    <hr>
    <div class="gridFour">
        <div class="oneParagraph">
            <p>Exercice four</p>
        </div>
        <div id="twoParagraphs">
            <p>First paragraph</p>
            <p>Second paragraph</p>
        </div>
    </div>
    <hr>
    <div class="gridFive">
        <div class="skyParagraph">
            <p>The sky melts into its colors.</p>
        </div>
        <div id="twoImages">
            <img src="images/atardecer (1).jpg" alt="atardecer">
            <img src="images/atardecer (2).jpg" alt="atardecer">
        </div>
    </div>
    <hr>
    <div class="gridSix">
        <i class="fa-regular fa-face-smile"></i>
        <p>If it ain't broke, don't fix it</p>

    </div>


    
</body>
</html>
